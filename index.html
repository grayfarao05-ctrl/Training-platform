<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITreal | REAL Knowledge, REAL Steps, Real Opportunities</title>
  <meta name="description" content="ITreal Tech Solutions - Gamified IT certification learning platform for South African youth. Master CompTIA A+, Network+, and practical tech skills.">
  <meta property="og:title" content="ITreal | REAL Knowledge, REAL Steps, Real Opportunities">
  <meta property="og:description" content="ITreal Tech Solutions - Gamified IT certification learning platform for South African youth. Master CompTIA A+, Network+, and practical tech skills.">
  <meta property="og:image" content="/assets/itreal-logo.png">
  <meta name="theme-color" content="#020308">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ITreal">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/assets/itreal-icon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    (function() {
      try {
        localStorage.setItem('itreal-theme', 'dark');
      } catch (e) {}
      document.documentElement.classList.add('dark');
      document.documentElement.classList.remove('light');
      document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & Instrument Serif (Ocean Breeze) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => {
          reg.update().catch(() => {});
          console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
        })
        .catch((err) => {
          console.warn('[PWA] ServiceWorker registration failed:', err);
        });
    });
  }
</script>
</body>
</html>
